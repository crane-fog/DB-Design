openapi: 3.0.1
info:
  title: 采购管理模块 API
  description: 采购管理模块接口定义，覆盖采购订单检索、基于缺口生成订单草稿、交期逾期提醒和分批收货。
  version: 0.1.0
tags:
  - name: purchase
    description: 采购管理模块
paths:
  /api/listPurchaseOrder:
    get:
      summary: 查询采购订单列表
      description: 关联采购订单主表、明细表和供应商表进行组合查询，返回到货进度和是否逾期。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。
      operationId: listPurchaseOrder
      tags: [purchase]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: supplier_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseOrderStatus'
        - name: order_date_start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: order_date_end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: expected_date_start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: expected_date_end
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: buyer_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderPageResponse'
  /api/getPurchaseOrder:
    get:
      summary: 查询采购订单详情
      description: 根据采购订单编号查询主表、明细、供应商和收货进度。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。
      operationId: getPurchaseOrder
      tags: [purchase]
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /api/addPurchaseOrder:
    post:
      summary: 新增采购订单草稿
      description: 手工新增采购订单草稿及明细，初始状态为 draft。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。业务约束：采购数量 quantity 必须大于 0，明细物料必须存在。
      operationId: addPurchaseOrder
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /api/createPurchaseOrderDraftFromShortage:
    post:
      summary: 根据缺口生成采购订单草稿
      description: 根据前端确认的缺口采购数量，关联物料默认供应商，并按供应商生成采购订单草稿。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。业务约束：purchase_qty 必须大于 0，未找到 supplier_id 的物料进入 unassigned_items。
      operationId: createPurchaseOrderDraftFromShortage
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseDraftFromShortageRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseDraftFromShortageResponse'
  /api/submitPurchaseOrder:
    post:
      summary: 提交采购订单
      description: 将采购订单从 draft 状态提交为 submitted 状态。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。状态流转：仅 draft 可提交，其他状态返回 code 409。
      operationId: submitPurchaseOrder
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderActionRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /api/cancelPurchaseOrder:
    post:
      summary: 取消采购订单
      description: 将可取消的采购订单更新为 cancelled 状态。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。状态流转：draft、submitted 可取消，partial_received、completed、cancelled 返回 code 409。
      operationId: cancelPurchaseOrder
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderActionRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderResponse'
  /api/addPurchaseReceipt:
    post:
      summary: 新增采购收货记录
      description: 支持分批到货，新增收货记录后自动更新明细已到货数量、订单状态和到货进度。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。业务约束：本次 quantity 加历史 received_qty 不得超过采购明细 quantity，超出返回 code 409。
      operationId: addPurchaseReceipt
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReceiptCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiptResponse'
  /api/listPurchaseReceipt:
    get:
      summary: 查询采购收货记录
      description: 分页查询采购订单分批收货记录。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。
      operationId: listPurchaseReceipt
      tags: [purchase]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReceiptPageResponse'
  /api/generatePurchaseOverdueReminder:
    post:
      summary: 生成采购逾期提醒
      description: 对超过预计交货日期且状态未 completed/cancelled 的采购订单生成逾期提醒。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。同一订单存在 pending_urge 提醒时不重复生成。
      operationId: generatePurchaseOverdueReminder
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOverdueReminderGenerateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOverdueReminderGenerateResponse'
  /api/listPurchaseOverdueReminder:
    get:
      summary: 查询采购逾期提醒
      description: 分页查询采购订单逾期提醒，支持按采购订单和处理状态过滤。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。
      operationId: listPurchaseOverdueReminder
      tags: [purchase]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PurchaseOverdueReminderStatus'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOverdueReminderPageResponse'
  /api/handlePurchaseOverdueReminder:
    post:
      summary: 处理采购逾期提醒
      description: 将逾期提醒更新为 urged 或 received，并记录处理备注。权限：采购员、采购主管、系统管理员可访问；无权限返回 code 403。状态流转：pending_urge 可变为 urged，urged 或 pending_urge 可变为 received，received 不可再处理。
      operationId: handlePurchaseOverdueReminder
      tags: [purchase]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOverdueReminderHandleRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOverdueReminderResponse'
components:
  schemas:
    PurchaseOrderStatus:
      type: string
      description: 采购订单状态。draft 草稿，可编辑、提交、取消；submitted 已提交，可收货、取消；partial_received 部分到货，可继续收货；completed 已完成，不可修改；cancelled 已取消，不可继续操作。允许流转：draft -> submitted/cancelled，submitted -> partial_received/completed/cancelled，partial_received -> completed。
      enum: [draft, submitted, partial_received, completed, cancelled]
    PurchaseOverdueReminderStatus:
      type: string
      description: 采购逾期提醒状态。pending_urge 待催交，可催交或标记到货；urged 已催交，可继续备注或标记到货；received 已到货，流程结束。允许流转：pending_urge -> urged/received，urged -> received。
      enum: [pending_urge, urged, received]
    SupplierDetail:
      allOf:
        - $ref: './common.yaml#/components/schemas/SupplierBrief'
        - type: object
          properties:
            contact_person:
              type: string
              nullable: true
              description: 供应商联系人，来源于 supplier.contact_person。
            contact_phone:
              type: string
              nullable: true
              description: 供应商联系电话，来源于 supplier.contact_phone。
    PurchaseOrderBrief:
      type: object
      required: [order_id, status, supplier_id]
      properties:
        order_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        supplier_id:
          type: integer
          format: int64
    PurchaseOrderDetailLine:
      type: object
      required: [item_id, order_id, material_id, quantity, received_qty, unit_price]
      properties:
        item_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        material_name:
          type: string
        quantity:
          type: number
          format: decimal
        received_qty:
          type: number
          format: decimal
        unit_price:
          type: number
          format: decimal
          minimum: 0
        line_amount:
          type: number
          format: decimal
          readOnly: true
          minimum: 0
          description: >
            明细金额，由后端根据 purchase_order_item.quantity 与 purchase_order_item.unit_price
            计算，公式为 quantity * unit_price。单位为元，保留两位小数，取值范围大于等于 0。
        receive_progress:
          type: number
          format: decimal
          readOnly: true
          minimum: 0
          maximum: 1
          description: >
            明细到货进度，由后端根据 purchase_order_item.received_qty 与 purchase_order_item.quantity
            计算，公式为 received_qty / quantity。取值范围为 0 到 1；当 quantity 为 0 时返回 0。
    PurchaseOrder:
      type: object
      required: [order_id, status, supplier, order_date, expected_date, buyer_id, total_amount, receive_progress, is_overdue, details]
      properties:
        order_id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        supplier:
          $ref: '#/components/schemas/SupplierDetail'
        order_date:
          type: string
          format: date
        expected_date:
          type: string
          format: date
        actual_date:
          type: string
          format: date
          nullable: true
        buyer_id:
          type: integer
          format: int64
        total_amount:
          type: number
          format: decimal
          readOnly: true
          minimum: 0
          description: >
            订单总金额，来源于 purchase_order.total_amount，由后端在新增、收货状态更新或明细变更时
            统一按所有明细 sum(quantity * unit_price) 计算并保存。单位为元，保留两位小数，
            取值范围大于等于 0。
        receive_progress:
          type: number
          format: decimal
          readOnly: true
          minimum: 0
          maximum: 1
          description: >
            订单整体到货进度，由后端汇总采购明细计算，公式为
            sum(purchase_order_item.received_qty) / sum(purchase_order_item.quantity)。
            取值范围为 0 到 1；当明细总采购数量为 0 时返回 0。
        is_overdue:
          type: boolean
          readOnly: true
          description: >
            是否逾期，由后端根据 purchase_order.expected_date、purchase_order.status 和当前日期判断。
            当当前日期晚于 expected_date，且 status 不为 completed 或 cancelled 时为 true，否则为 false。
        overdue_days:
          type: integer
          readOnly: true
          minimum: 0
          description: >
            逾期天数，由后端在 is_overdue 为 true 时按当前日期 - purchase_order.expected_date 计算，
            单位为天，取值范围大于等于 0；当订单未逾期、已完成或已取消时返回 0。
        details:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseOrderDetailLine'
    PurchaseOrderCreateRequest:
      type: object
      required: [supplier_id, expected_date, buyer_id, details]
      properties:
        supplier_id:
          type: integer
          format: int64
        expected_date:
          type: string
          format: date
        buyer_id:
          type: integer
          format: int64
        details:
          type: array
          minItems: 1
          items:
            type: object
            required: [material_id, quantity, unit_price]
            properties:
              material_id:
                type: integer
                format: int64
              quantity:
                type: number
                format: decimal
                minimum: 0
                exclusiveMinimum: true
              unit_price:
                type: number
                format: decimal
                minimum: 0
    PurchaseDraftFromShortageRequest:
      type: object
      required: [expected_date, buyer_id, items]
      properties:
        expected_date:
          type: string
          format: date
        buyer_id:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [material_id, purchase_qty]
            properties:
              material_id:
                type: integer
                format: int64
              purchase_qty:
                type: number
                format: decimal
                minimum: 0
                exclusiveMinimum: true
                description: >
                  用户确认的本次采购数量，通常来自库存缺口计算响应中的 suggested_purchase_qty，
                  但作为请求字段时表示前端提交的采购数量。单位与物料 material.unit 一致，必须大于 0。
              supplier_id:
                type: integer
                format: int64
                nullable: true
                description: >
                  指定供应商编号。为空时后端使用 material.default_supplier_id；仍为空则该物料进入
                  unassigned_items，不生成采购订单明细。
    PurchaseOrderActionRequest:
      type: object
      required: [order_id, operator_id]
      properties:
        order_id:
          type: integer
          format: int64
        operator_id:
          type: integer
          format: int64
    PurchaseReceipt:
      type: object
      required: [receive_id, order_id, material_id, quantity, receive_date]
      properties:
        receive_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        material_name:
          type: string
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        receive_date:
          type: string
          format: date
    PurchaseReceiptCreateRequest:
      type: object
      required: [order_id, material_id, quantity, receive_date]
      properties:
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        quantity:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        receive_date:
          type: string
          format: date
    PurchaseOverdueReminder:
      type: object
      required: [reminder_id, order_id, expected_date, overdue_days, remind_time, status]
      properties:
        reminder_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        expected_date:
          type: string
          format: date
        overdue_days:
          type: integer
          minimum: 1
        remind_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/PurchaseOverdueReminderStatus'
        remark:
          type: string
          nullable: true
    PurchaseOverdueReminderGenerateRequest:
      type: object
      properties:
        order_id:
          type: integer
          format: int64
          nullable: true
    PurchaseOverdueReminderHandleRequest:
      type: object
      required: [reminder_id, status]
      properties:
        reminder_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [urged, received]
        remark:
          type: string
          nullable: true
    PurchaseOrderResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseOrder'
              nullable: true
    PurchaseOrderPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseOrderPageData'
              nullable: true
    PurchaseOrderPageData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseOrder'
    PurchaseDraftFromShortageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              properties:
                created_count:
                  type: integer
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/PurchaseOrder'
                unassigned_items:
                  type: array
                  description: 未找到默认供应商而无法生成草稿的物料。
                  items:
                    type: object
                    properties:
                      material_id:
                        type: integer
                        format: int64
                      purchase_qty:
                        type: number
                        format: decimal
                        minimum: 0
                        exclusiveMinimum: true
                        description: 用户确认但因缺少供应商而未生成采购草稿的采购数量，单位与物料 material.unit 一致。
    PurchaseReceiptResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseReceipt'
              nullable: true
    PurchaseReceiptPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseReceiptPageData'
              nullable: true
    PurchaseReceiptPageData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/PurchaseReceipt'
    PurchaseOverdueReminderGenerateResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              properties:
                generated_count:
                  type: integer
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/PurchaseOverdueReminder'
    PurchaseOverdueReminderResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseOverdueReminder'
              nullable: true
    PurchaseOverdueReminderPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/PurchaseOverdueReminderPageData'
