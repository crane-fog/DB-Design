openapi: 3.0.1
info:
  title: 生产管理模块 API
  description: 生产管理模块接口定义，覆盖生产订单检索、产能配置、产能估计、外部订单、产能检测与平衡、生产线故障反馈和生产线状态记录。
  version: 0.1.0
tags:
  - name: production
    description: 生产管理模块
paths:
  /api/listProductionOrder:
    get:
      summary: 查询生产订单列表
      description: 按产品、订单状态、计划完工日期等条件分页查询生产订单。权限：生产管理员、系统管理员可访问；外部客户不可访问；无权限返回 code 403。
      operationId: listProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductionOrderStatus'
        - name: plan_end_start
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: plan_end_end
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderPageResponse'
  /api/getProductionOrder:
    get:
      summary: 查询生产订单详情
      description: 根据生产订单编号查询产品、BOM 版本、计划数量、完工数量、计划与实际起止时间和订单状态。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: getProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/addProductionOrder:
    post:
      summary: 新增生产订单
      description: 新增内部生产订单，初始状态为 pending_review。权限：生产管理员、系统管理员可访问；无权限返回 code 403。业务约束：plan_qty 必须大于 0，产品和 BOM 版本必须存在。
      operationId: addProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/updateProductionOrder:
    post:
      summary: 修改生产订单计划
      description: 修改 pending_review 或 pending_schedule 状态下生产订单的计划数量、计划起止日期和 BOM 版本。权限：生产管理员、系统管理员可访问；状态不允许修改时返回 code 409。
      operationId: updateProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderUpdateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/approveProductionOrder:
    post:
      summary: 审核生产订单
      description: 审核 pending_review 生产订单。审核通过后进入 pending_schedule；审核拒绝时进入 cancelled 并记录审核意见。权限：生产管理员、系统管理员可访问；非法状态返回 code 409。
      operationId: approveProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderApproveRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/startProductionOrder:
    post:
      summary: 开始生产订单
      description: 将 pending_schedule 状态的生产订单置为 in_progress，并记录 actual_start。权限：生产管理员、系统管理员可访问；非法状态返回 code 409。
      operationId: startProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderActionRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/finishProductionOrder:
    post:
      summary: 完成生产订单
      description: 将 in_progress 状态的生产订单置为 completed，更新 finished_qty 和 actual_end。权限：生产管理员、系统管理员可访问；非法状态返回 code 409。
      operationId: finishProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderFinishRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/cancelProductionOrder:
    post:
      summary: 取消生产订单
      description: 将 pending_review、pending_schedule 或 in_progress 状态的生产订单置为 cancelled。权限：生产管理员、系统管理员可访问；completed/cancelled 状态返回 code 409。
      operationId: cancelProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionOrderActionRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrderResponse'
  /api/listProductionLine:
    get:
      summary: 查询生产线列表
      description: 分页查询生产线及其线型、启用日期、负责人和当前状态。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listProductionLine
      tags: [production]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: type_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductionLineStatusValue'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLinePageResponse'
  /api/addProductionLine:
    post:
      summary: 新增生产线
      description: 新增生产线并初始化 line_status 记录，默认状态为 idle。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: addProductionLine
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLineCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLineResponse'
  /api/listCapacityConfig:
    get:
      summary: 查询产品产能配置
      description: 分页查询产品所需生产线类型和单件生产时间。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listCapacityConfig
      tags: [production]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: type_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConfigPageResponse'
  /api/saveCapacityConfig:
    post:
      summary: 保存产品产能配置
      description: 新增或更新产品产能配置。权限：生产管理员、系统管理员可访问；业务约束：unit_time 必须大于 0。
      operationId: saveCapacityConfig
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityConfigSaveRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityConfigResponse'
  /api/estimateProductionCapacity:
    post:
      summary: 估计生产订单交付能力
      description: 结合物料齐套情况、采购预计到货时间、产能配置和生产线排产计划，估计订单能否按期交付。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: estimateProductionCapacity
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionCapacityEstimateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionCapacityEstimateResponse'
  /api/listExternalOrder:
    get:
      summary: 查询外部订单列表
      description: 分页查询外部客户提交的订单。外部客户只能查询自己的订单；生产管理员和系统管理员可查询全部；无权限返回 code 403。
      operationId: listExternalOrder
      tags: [production]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: customer_id
          in: query
          required: false
          description: 外部客户角色只能传自身 user_id。
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExternalOrderStatus'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOrderPageResponse'
  /api/addExternalOrder:
    post:
      summary: 外部客户提交订单
      description: 外部客户提交产品预订订单，初始状态为 pending_review。外部客户只能为自身提交；生产管理员、系统管理员可代录；无权限返回 code 403。
      operationId: addExternalOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalOrderCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOrderResponse'
  /api/reviewExternalOrder:
    post:
      summary: 审核外部订单
      description: 审核 pending_review 外部订单。通过后状态为 accepted，拒绝后状态为 rejected，并记录审核意见。权限：生产管理员、系统管理员可访问；非法状态返回 code 409。
      operationId: reviewExternalOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalOrderReviewRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOrderResponse'
  /api/convertExternalOrderToProductionOrder:
    post:
      summary: 外部订单转生产订单
      description: 将 accepted 外部订单转换为一个或多个正式生产订单，并维护外部订单与生产订单关联关系。权限：生产管理员、系统管理员可访问；非法状态返回 code 409。
      operationId: convertExternalOrderToProductionOrder
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalOrderConvertRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalOrderConvertResponse'
  /api/runCapacityDetection:
    post:
      summary: 执行产能检测
      description: 按生产线和统计周期记录计划产能、实际产能、差异数量和差异比例。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: runCapacityDetection
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityDetectionRunRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityDetectionResponse'
  /api/saveCapacityBalance:
    post:
      summary: 保存产能平衡调整
      description: 保存产能调整前后排产方案、调整人和受影响生产订单列表。权限：生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: saveCapacityBalance
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapacityBalanceSaveRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapacityBalanceResponse'
  /api/reportProductionLineFault:
    post:
      summary: 上报生产线故障
      description: 上报生产线故障，初始状态为 pending_repair。权限：生产管理员、生产线负责人、系统管理员可访问；无权限返回 code 403。
      operationId: reportProductionLineFault
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultRecordCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultRecordResponse'
  /api/updateProductionLineFault:
    post:
      summary: 更新生产线故障状态
      description: 更新故障记录状态和维修负责人。状态流转：pending_repair -> repairing -> recovered。权限：生产管理员、维修负责人、系统管理员可访问；非法状态返回 code 409。
      operationId: updateProductionLineFault
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaultRecordUpdateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaultRecordResponse'
  /api/updateProductionLineStatus:
    post:
      summary: 更新生产线状态
      description: 更新生产线当前状态、当前生产订单、当前产品、已完成数量、当前效率和更新时间。权限：生产管理员、生产线负责人、系统管理员可访问；无权限返回 code 403。
      operationId: updateProductionLineStatus
      tags: [production]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductionLineStatusUpdateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionLineStatusResponse'
components:
  schemas:
    ProductionOrderStatus:
      type: string
      description: 生产订单状态。pending_review 待审核，可审核或取消；pending_schedule 待排产，可修改、开始或取消；in_progress 生产中，可完工或取消；completed 已完工，流程结束；cancelled 已取消，流程结束。
      enum: [pending_review, pending_schedule, in_progress, completed, cancelled]
    ExternalOrderStatus:
      type: string
      description: 外部订单状态。pending_review 待审核；accepted 已接受，可转换为生产订单；rejected 已拒绝，流程结束。
      enum: [pending_review, accepted, rejected]
    ProductionLineStatusValue:
      type: string
      description: 生产线状态。idle 空闲；running 运行中；fault 故障。
      enum: [idle, running, fault]
    FaultStatus:
      type: string
      description: 故障状态。pending_repair 待维修；repairing 维修中；recovered 已恢复。
      enum: [pending_repair, repairing, recovered]
    ProductionOrderBrief:
      type: object
      required: [order_id, material_id, plan_qty, status]
      properties:
        order_id:
          type: integer
          format: int64
          example: 3001
        material_id:
          type: integer
          format: int64
          example: 1001
        material_name:
          type: string
          example: 工业叉车
        plan_qty:
          type: number
          format: decimal
          example: 50
        finished_qty:
          type: number
          format: decimal
          example: 10
        status:
          $ref: '#/components/schemas/ProductionOrderStatus'
    ProductionOrderDetail:
      allOf:
        - $ref: '#/components/schemas/ProductionOrderBrief'
        - type: object
          required: [version_id, plan_start, plan_end]
          properties:
            version_id:
              type: integer
              format: int64
              example: 1
            version_no:
              type: string
              example: V1.0
            plan_start:
              type: string
              format: date
              example: '2026-07-10'
            plan_end:
              type: string
              format: date
              example: '2026-07-20'
            actual_start:
              type: string
              format: date
              nullable: true
            actual_end:
              type: string
              format: date
              nullable: true
            review_comment:
              type: string
              nullable: true
              example: 产能满足要求
    ProductionOrderCreateRequest:
      type: object
      required: [material_id, version_id, plan_qty, plan_start, plan_end]
      properties:
        material_id:
          type: integer
          format: int64
        version_id:
          type: integer
          format: int64
        plan_qty:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        plan_start:
          type: string
          format: date
        plan_end:
          type: string
          format: date
    ProductionOrderUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/ProductionOrderCreateRequest'
        - type: object
          required: [order_id]
          properties:
            order_id:
              type: integer
              format: int64
    ProductionOrderApproveRequest:
      type: object
      required: [order_id, approved, reviewer_id]
      properties:
        order_id:
          type: integer
          format: int64
        approved:
          type: boolean
          description: true 表示审核通过，false 表示审核拒绝。
        reviewer_id:
          type: integer
          format: int64
        review_comment:
          type: string
          nullable: true
    ProductionOrderActionRequest:
      type: object
      required: [order_id, operator_id]
      properties:
        order_id:
          type: integer
          format: int64
        operator_id:
          type: integer
          format: int64
        remark:
          type: string
          nullable: true
    ProductionOrderFinishRequest:
      allOf:
        - $ref: '#/components/schemas/ProductionOrderActionRequest'
        - type: object
          required: [finished_qty]
          properties:
            finished_qty:
              type: number
              format: decimal
              minimum: 0
              exclusiveMinimum: true
    LineType:
      type: object
      required: [type_id, type_name]
      properties:
        type_id:
          type: integer
          format: int64
        type_name:
          type: string
          example: 总装线
    ProductionLine:
      type: object
      required: [line_id, type_id, start_date, manager_id]
      properties:
        line_id:
          type: integer
          format: int64
        type_id:
          type: integer
          format: int64
