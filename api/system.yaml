openapi: 3.0.1
info:
  title: 系统管理模块 API
  description: 系统管理模块接口定义。
  version: 0.1.0
tags:
  - name: system
    description: 系统管理模块
paths:
  /api/login:
    post:
      summary: 登录
      description: 公开接口，无需登录，所有用户可访问；不需要携带 Authorization 请求头。HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
      operationId: login
      tags:
        - system
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              employee_no: EMP001
              password: 5f4dcc3b5aa765d61d8327deb882cf99
      responses:
        '200':
          description: 统一响应；成功时 data 为登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 200
                    message: 登录成功
                    data:
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expires: 7200
                invalidPassword:
                  summary: 工号或密码错误
                  value:
                    code: 400
                    message: 工号或密码错误
                    data: null

  /api/register:
    post:
      summary: 注册系统用户
      description: 公开接口，无需登录，所有用户可访问；不需要携带 Authorization 请求头。HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
      operationId: register
      tags:
        - system
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              employee_no: EMP001
              password: 5f4dcc3b5aa765d61d8327deb882cf99
              user_name: 张三
              phone: '13800000000'
              email: zhangsan@example.com
      responses:
        '200':
          description: 统一响应；成功时 data 为注册后的用户信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                success:
                  summary: 注册成功
                  value:
                    code: 200
                    message: 注册成功
                    data:
                      user_id: 1
                      employee_no: EMP001
                      user_name: 张三
                      phone: '13800000000'
                      email: zhangsan@example.com
                      status: valid
                userExists:
                  summary: 工号已存在
                  value:
                    code: 409
                    message: 工号已存在
                    data: null

  /api/listUserData:
    get:
      summary: 查询用户列表
      description: 分页查询系统用户。需登录；仅系统管理员可访问；未登录或登录失效返回 code 401；已登录但权限不足返回 code 403。
      operationId: listUserData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: user_id
          in: query
          description: 用户编号。
          schema:
            type: integer
        - name: employee_no
          in: query
          description: 工号，支持精确或模糊匹配。
          schema:
            type: string
        - name: user_name
          in: query
          description: 用户姓名，支持模糊匹配。
          schema:
            type: string
        - name: status
          in: query
          description: 账号状态。
          schema:
            type: string
            enum:
              - valid
              - disabled
      responses:
        '200':
          description: 统一响应；成功时 data 为分页用户列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
      security:
        - bearerAuth: []

  /api/getUserData:
    get:
      summary: 查询用户详情
      description: 查询系统用户详情。需登录；仅系统管理员可访问；未登录或登录失效返回 code 401；已登录但权限不足返回 code 403。
      operationId: getUserData
      tags:
        - system
      parameters:
        - name: user_id
          in: query
          required: true
          description: 用户编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为用户详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - bearerAuth: []

  /api/addUserData:
    post:
      summary: 新增用户
