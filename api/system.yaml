openapi: 3.0.1
info:
  title: 系统管理模块 API
  description: 系统管理模块接口定义。
  version: 0.1.0
tags:
  - name: system
    description: 系统管理模块
paths:
  /api/login:
    post:
      summary: 登录
      deprecated: false
      description: 登录接口不需要携带 Authorization 请求头。
      operationId: login
      tags:
        - system
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              userNo: ''
              password: ''
        required: true
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 200
                    message: 登录成功
                    data:
                      accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expires: 7200
                invalidPassword:
                  summary: 用户名或密码错误
                  value:
                    code: 400
                    message: 用户编号或密码错误
                    data: null
          headers: {}
  /api/register:
    post:
      summary: 注册系统用户
      deprecated: false
      description: 注册接口不需要携带 Authorization 请求头。
      operationId: register
      tags:
        - system
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              userNo: ''
              password: ''
              userName: ''
              phone: ''
              email: ''
        required: true
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                success:
                  summary: 注册成功
                  value:
                    code: 200
                    message: 注册成功
                    data: null
                userExists:
                  summary: 用户已存在
                  value:
                    code: 409
                    message: 用户编号已存在
                    data: null
          headers: {}
  /api/getUserTest:
    get:
      summary: 获取测试用户数据表
      deprecated: false
      description: '需要登录后访问，调用时请求头使用 Authorization: Bearer <token>。'
      operationId: getUserTest
      tags:
        - system
      parameters: []
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTestResponse'
              examples:
                success:
                  summary: 成功返回用户列表
                  value:
                    code: 200
                    message: 查询成功
                    data:
                      - id: 113
                        name: 李四
                        createdAt: '2026-03-02T21:44:02.29113'
                      - id: 114
                        name: 王七
                        createdAt: '2026-03-03T10:15:30.12345'
                unauthorized:
                  summary: 未登录或登录已失效
                  value:
                    code: 401
                    message: 未登录或登录已失效
                    data: null
          headers: {}
      security:
        - bearerAuth: []
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - userNo
        - password
      properties:
        userNo:
          type: string
          example: ''
        password:
          type: string
          format: password
          example: ''
    LoginData:
      type: object
      required:
        - accessToken
        - expires
      properties:
        accessToken:
          type: string
          description: JWT 访问令牌。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
        expires:
          type: number
          description: token 过期时间或有效期，具体含义以后端实现为准。
          example: 7200
    LoginResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/LoginData'
              nullable: true
    RegisterRequest:
      type: object
      required:
        - userNo
        - password
        - userName
        - phone
      properties:
        userNo:
          type: string
          example: ''
        password:
          type: string
          format: password
          example: ''
        userName:
          type: string
          example: ''
        phone:
          type: string
          example: ''
        email:
          type: string
          format: email
          example: ''
    RegisterResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              nullable: true
              example: null
    UserData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 113
        name:
          type: string
          example: 李四
        createdAt:
          type: string
          format: date-time
          example: '2026-03-02T21:44:02.29113'
    UserTestResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/UserData'
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
