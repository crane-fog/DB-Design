          type: string
        email:
          type: string
          nullable: true
        status:
          type: string
          description: 账号状态。valid：启用，允许登录并按角色权限访问系统；disabled：停用，禁止登录但保留历史业务引用。允许通过 updateUserData 在 valid 与 disabled 之间切换。
          enum:
            - valid
            - disabled

    User:
