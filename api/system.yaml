openapi: 3.0.1
info:
  title: 系统管理模块 API
  description: 系统管理模块接口定义。
  version: 0.1.0
tags:
  - name: system
    description: 系统管理模块
paths:
  /api/login:
    post:
      summary: 登录
      description: 公开接口，无需登录，所有用户可访问；不需要携带 Authorization 请求头。HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
      operationId: login
      tags:
        - system
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              employee_no: EMP001
              password: 5f4dcc3b5aa765d61d8327deb882cf99
      responses:
        '200':
          description: 统一响应；成功时 data 为登录令牌。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  summary: 登录成功
                  value:
                    code: 200
                    message: 登录成功
                    data:
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expires: 7200
                invalidPassword:
                  summary: 工号或密码错误
                  value:
                    code: 400
                    message: 工号或密码错误
                    data: null

  /api/register:
    post:
      summary: 注册系统用户
      description: 公开接口，无需登录，所有用户可访问；不需要携带 Authorization 请求头。HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
      operationId: register
      tags:
        - system
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              employee_no: EMP001
              password: 5f4dcc3b5aa765d61d8327deb882cf99
              user_name: 张三
              phone: '13800000000'
              email: zhangsan@example.com
      responses:
        '200':
          description: 统一响应；成功时 data 为注册后的用户信息。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                success:
                  summary: 注册成功
                  value:
                    code: 200
                    message: 注册成功
                    data:
                      user_id: 1
                      employee_no: EMP001
                      user_name: 张三
                      phone: '13800000000'
                      email: zhangsan@example.com
                      status: valid
                userExists:
                  summary: 工号已存在
                  value:
                    code: 409
                    message: 工号已存在
                    data: null

  /api/getCurrentAccess:
    get:
      summary: 查询当前登录者身份与权限
      description: |
        供登录后及会话恢复时初始化当前用户的访问权限。仅要求有效登录，不要求业务权限。
        当前身份只能从 JWT 的 employee_no 声明解析，不通过客户端传入的用户编号或工号选择用户。
        返回当前用户的最小身份信息、全部有效角色和有效角色关联权限码的并集，不分页，不返回其他用户的信息。
        停用角色及其权限不参与计算；没有有效角色的用户仍返回 code 200，roles 和 permission_codes 均为空数组。
        角色名称仅用于展示，不参与授权判断；任何角色都只拥有角色权限关系中明确配置的权限，不存在按角色名称自动放行规则。
        HTTP 状态码固定返回 200；未登录、令牌失效、用户不存在或账号停用时返回 code 401，data 为 null。
        本接口不放宽用户、角色和权限管理列表的管理员限制，各业务操作仍由后端独立鉴权。
      operationId: getCurrentAccess
      tags:
        - system
      parameters: []
      responses:
        '200':
          description: 统一响应；成功时 data 为当前登录者访问上下文，失败时 data 为 null。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentAccessResponse'
              examples:
                success:
                  summary: 业务角色用户查询成功
                  value:
                    code: 200
                    message: 查询成功
                    data:
                      current_user:
                        user_id: 2
                        employee_no: EMP002
                        user_name: 张三
                      roles:
                        - role_id: 2
                          role_name: 生产管理员
                          status: valid
                      permission_codes:
                        - production:order:view
                noRoles:
                  summary: 无有效角色的用户查询成功
                  value:
                    code: 200
                    message: 查询成功
                    data:
                      current_user:
                        user_id: 3
                        employee_no: EMP003
                        user_name: 李四
                      roles: []
                      permission_codes: []
                unauthorized:
                  summary: 未登录、登录失效或账号不可用
                  value:
                    code: 401
                    message: 未登录、登录已失效或账号不可用
                    data: null
      security:
        - bearerAuth: []

  /api/listUserData:
    get:
      summary: 查询用户列表
      description: 分页查询系统用户。需具备 system:user:view；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: listUserData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: user_id
          in: query
          description: 用户编号。
          schema:
            type: integer
        - name: employee_no
          in: query
          description: 工号，支持精确或模糊匹配。
          schema:
            type: string
        - name: user_name
          in: query
          description: 用户姓名，支持模糊匹配。
          schema:
            type: string
        - name: status
          in: query
          description: 账号状态。
          schema:
            type: string
            enum:
              - valid
              - disabled
      responses:
        '200':
          description: 统一响应；成功时 data 为分页用户列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
      security:
        - bearerAuth: []

  /api/getUserData:
    get:
      summary: 查询用户详情
      description: 查询系统用户详情。需具备 system:user:view；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: getUserData
      tags:
        - system
      parameters:
        - name: user_id
          in: query
          required: true
          description: 用户编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为用户详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - bearerAuth: []

  /api/addUserData:
    post:
      summary: 新增用户
      description: 新增系统用户。需具备 system:user:create；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: addUserData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为新增后的用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - bearerAuth: []

  /api/updateUserData:
    post:
      summary: 修改用户
      description: 修改系统用户基础信息、密码或账号状态。需具备 system:user:update；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: updateUserData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为修改后的用户。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
        - bearerAuth: []

  /api/deleteUserData:
    post:
      summary: 删除用户
      description: 删除系统用户。需具备 system:user:delete；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: deleteUserData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDeleteRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为 null。
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiResponse'
      security:
        - bearerAuth: []

  /api/listRoleData:
    get:
      summary: 查询角色列表
      description: 分页查询系统角色。需具备 system:role:view；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: listRoleData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: role_id
          in: query
          description: 角色编号。
          schema:
            type: integer
        - name: role_name
          in: query
          description: 角色名称，支持模糊匹配。
          schema:
            type: string
        - name: status
          in: query
          description: 角色状态。
          schema:
            type: string
            enum:
              - valid
              - disabled
      responses:
        '200':
          description: 统一响应；成功时 data 为分页角色列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePageResponse'
      security:
        - bearerAuth: []

  /api/getRoleData:
    get:
      summary: 查询角色详情
      description: 查询系统角色详情。需具备 system:role:view；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: getRoleData
      tags:
        - system
      parameters:
        - name: role_id
          in: query
          required: true
          description: 角色编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为角色详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
      security:
        - bearerAuth: []

  /api/addRoleData:
    post:
      summary: 新增角色
      description: 新增系统角色。需具备 system:role:create；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: addRoleData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreateRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为新增后的角色。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
      security:
        - bearerAuth: []

  /api/updateRoleData:
    post:
      summary: 修改角色
      description: 修改系统角色名称、描述或状态。需具备 system:role:update；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: updateRoleData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdateRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为修改后的角色。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
      security:
        - bearerAuth: []

  /api/deleteRoleData:
    post:
      summary: 删除角色
      description: 删除系统角色。需具备 system:role:delete；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: deleteRoleData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleDeleteRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为 null。
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiResponse'
      security:
        - bearerAuth: []

  /api/listPermissionData:
    get:
      summary: 查询权限列表
      description: 分页查询只读权限目录。需具备 system:permission:view；权限码是稳定的系统契约，不通过运行时接口新增、修改或删除。
      operationId: listPermissionData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: permission_id
          in: query
          description: 权限编号。
          schema:
            type: integer
        - name: permission_code
          in: query
          description: 稳定权限码，支持模糊匹配。
          schema:
            type: string
        - name: module_name
          in: query
          description: 模块显示名称，支持模糊匹配。
          schema:
            type: string
        - name: resource_name
          in: query
          description: 资源显示名称，支持模糊匹配。
          schema:
            type: string
        - name: action_name
          in: query
          description: 操作显示名称，支持模糊匹配。
          schema:
            type: string
      responses:
        '200':
          description: 统一响应；成功时 data 为分页权限列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageResponse'
      security:
        - bearerAuth: []

  /api/getPermissionData:
    get:
      summary: 查询权限详情
      description: 查询只读权限目录中的权限详情。需具备 system:permission:view。
      operationId: getPermissionData
      tags:
        - system
      parameters:
        - name: permission_id
          in: query
          required: true
          description: 权限编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为权限详情。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
      security:
        - bearerAuth: []

  /api/listUserRoleData:
    get:
      summary: 查询用户角色关系列表
      description: 分页查询用户与角色的多对多关系。需具备 system:user:assign-role；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: listUserRoleData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: user_id
          in: query
          description: 用户编号。
          schema:
            type: integer
        - name: role_id
          in: query
          description: 角色编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为分页用户角色关系列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolePageResponse'
      security:
        - bearerAuth: []

  /api/setUserRoles:
    post:
      summary: 设置用户角色集合
      description: 使用请求中的完整角色编号集合替换用户当前的全部角色关联，允许传空数组以移除全部角色。操作必须在一个事务内完成。需具备 system:user:assign-role。
      operationId: setUserRoles
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleSetRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为替换后的完整用户角色关系。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRoleSetResponse'
      security:
        - bearerAuth: []

  /api/listRolePermissionData:
    get:
      summary: 查询角色权限关系列表
      description: 分页查询角色与权限的多对多关系。需具备 system:role:assign-permission；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: listRolePermissionData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: role_id
          in: query
          description: 角色编号。
          schema:
            type: integer
        - name: permission_id
          in: query
          description: 权限编号。
          schema:
            type: integer
      responses:
        '200':
          description: 统一响应；成功时 data 为分页角色权限关系列表。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionPageResponse'
      security:
        - bearerAuth: []

  /api/setRolePermissions:
    post:
      summary: 设置角色权限集合
      description: 使用请求中的完整权限编号集合替换角色当前的全部权限关联，允许传空数组以移除全部权限。操作必须在一个事务内完成。需具备 system:role:assign-permission。
      operationId: setRolePermissions
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionSetRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为替换后的完整角色权限关系。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionSetResponse'
      security:
        - bearerAuth: []

  /api/listLoginRecordData:
    get:
      summary: 查询登录日志
      description: 分页查询用户登录日志。需具备 system:audit:login:view；未登录或登录失效返回 code 401；权限不足返回 code 403。
      operationId: listLoginRecordData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: employee_no
          in: query
          description: 用户工号，支持模糊匹配。
          schema:
            type: string
        - name: user_name
          in: query
          description: 用户姓名，支持模糊匹配。
          schema:
            type: string
        - name: result
          in: query
          description: 登录结果。
          schema:
            type: string
            enum:
              - success
              - failure
        - name: start_time
          in: query
          description: 登录开始时间。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 登录结束时间。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 统一响应；成功时 data 为分页登录日志。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginLogPageResponse'
      security:
        - bearerAuth: []

  /api/listOperationLogData:
    get:
      summary: 查询操作日志
      description: 分页查询系统操作日志。需具备 system:audit:operation:view；未登录或登录失效返回 code 401；权限不足返回 code 403。日志为追踪写入，正式业务不提供修改或删除接口。
      operationId: listOperationLogData
      tags:
        - system
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: module
          in: query
          description: 操作模块，支持模糊匹配。
          schema:
            type: string
        - name: action
          in: query
          description: 操作类型，支持模糊匹配。
          schema:
            type: string
        - name: employee_no
          in: query
          description: 操作人工号，支持模糊匹配。
          schema:
            type: string
        - name: user_name
          in: query
          description: 操作人姓名，支持模糊匹配。
          schema:
            type: string
        - name: start_time
          in: query
          description: 操作开始时间。
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          description: 操作结束时间。
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 统一响应；成功时 data 为分页操作日志。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogPageResponse'
      security:
        - bearerAuth: []

  /api/addOperationLogData:
    post:
      summary: 新增操作日志
      description: 追踪写入操作日志。需具备 system:audit:operation:create；未登录或登录失效返回 code 401；权限不足返回 code 403。日志数据不提供修改或删除接口。
      operationId: addOperationLogData
      tags:
        - system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationLogCreateRequest'
      responses:
        '200':
          description: 统一响应；成功时 data 为新增后的操作日志。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationLogResponse'
      security:
        - bearerAuth: []

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - employee_no
        - password
      properties:
        employee_no:
          type: string
          description: 工号，唯一约束，用于登录。
          example: EMP001
        password:
          type: string
          format: password
          description: 前端传入的密码哈希值，sha256。
          example: 8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92

    LoginData:
      type: object
      required:
        - access_token
        - expires
      properties:
        access_token:
          type: string
          description: JWT 访问令牌。
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJlbXBsb3llZV9ubyI6IjI0NTAzMTMiLCJuYmYiOjE3ODM2OTg1ODAsImV4cCI6MTc4MzcwMjE4MH0.tFFAtFV5PaosfjMEVkQ0g97eK0RVAYHYvyxq7P3JKKw
        expires:
          type: integer
          description: token 有效期，单位秒。
          example: 7200

    LoginResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/LoginData'
              nullable: true

    CurrentAccessUser:
      type: object
      description: 当前登录者的最小身份信息，不包含密码哈希或联系方式。
      required:
        - user_id
        - employee_no
        - user_name
      properties:
        user_id:
          type: integer
          format: int64
          minimum: 1
          description: 当前登录用户的唯一编号。
        employee_no:
          type: string
          description: 根据 JWT 身份查询得到的当前用户工号。
        user_name:
          type: string
          description: 当前用户姓名。

    CurrentAccessData:
      type: object
      required:
        - current_user
        - roles
        - permission_codes
      properties:
        current_user:
          $ref: '#/components/schemas/CurrentAccessUser'
        roles:
          type: array
          description: 当前用户全部有效角色，仅用于身份展示和角色管理，不参与前后端授权判断。
          items:
            $ref: '#/components/schemas/RoleBrief'
        permission_codes:
          type: array
          description: 当前用户全部有效角色关联权限码的并集。无有效角色或角色均未配置权限时为空数组。
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PermissionCode'

    CurrentAccessResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
                - $ref: '#/components/schemas/CurrentAccessData'
              nullable: true

    RegisterRequest:
      type: object
      required:
        - employee_no
        - password
        - user_name
        - phone
      properties:
        employee_no:
          type: string
          description: 工号，唯一约束。
          example: EMP001
        password:
          type: string
          format: password
          description: 登录密码或前端传入的密码哈希值，sha256。
          example: 8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92
        user_name:
          type: string
          example: 张三
        phone:
          type: string
          example: '13800000000'
        email:
          type: string
          format: email
          nullable: true
          example: zhangsan@example.com

    RegisterResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              allOf:
