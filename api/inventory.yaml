openapi: 3.0.1
info:
  title: 库存管理模块 API
  description: 库存管理模块接口定义，覆盖物料缺口计算、库存预警、物料锁定、废弃物料检测和完工入库。
  version: 0.1.0
tags:
  - name: inventory
    description: 库存管理模块
paths:
  /api/calculateMaterialShortage:
    post:
      summary: 计算物料缺口
      description: 根据 material_id、production_qty 和 version_id 递归展开 BOM，汇总毛需求、可用数量、在途数量和安全库存，计算净缺口。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: calculateMaterialShortage
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialShortageCalculateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialShortageCalculateResponse'
  /api/listInventoryAlert:
    get:
      summary: 查询库存预警事件
      description: 分页查询低库存预警事件，支持按 material_id、status 和触发时间过滤。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listInventoryAlert
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InventoryAlertStatus'
        - name: start_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAlertPageResponse'
  /api/generateInventoryAlert:
    post:
      summary: 生成库存预警事件
      description: 比较物料 available_qty 与安全库存阈值，低于阈值时生成 low_stock 预警；同一 material_id 已有 pending 预警时不重复生成。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: generateInventoryAlert
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAlertGenerateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAlertGenerateResponse'
  /api/handleInventoryAlert:
    post:
      summary: 处理库存预警事件
      description: 将库存预警事件更新为 handled 或 ignored，并记录 handler_id 和 handle_time。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。状态流转：pending -> handled/ignored，handled 和 ignored 不可再次处理。
      operationId: handleInventoryAlert
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryAlertHandleRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAlertResponse'
  /api/lockMaterialStock:
    post:
      summary: 锁定物料库存
      description: 为生产订单锁定物料库存，锁定前校验 available_qty；不足时拒绝并返回 shortage_qty。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。业务约束：lock_qty 必须大于 0，锁定成功后增加 locked_qty 并减少 available_qty。
      operationId: lockMaterialStock
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialStockLockRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialStockLockResponse'
  /api/releaseMaterialStock:
    post:
      summary: 释放物料锁定
      description: 订单取消时反向释放锁定库存，减少 locked_qty 并恢复 available_qty。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。状态流转：仅 locked 可释放为 cancelled，consumed/cancelled 返回 code 409。
      operationId: releaseMaterialStock
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialStockReleaseRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLockRecordResponse'
  /api/listMaterialStockLock:
    get:
      summary: 查询物料锁定记录
      description: 分页查询物料 locked、cancelled 和 consumed 记录。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listMaterialStockLock
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StockLockStatus'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLockRecordPageResponse'
  /api/detectObsoleteMaterial:
    post:
      summary: 检测废弃物料
      description: 根据 last_out_date、available_qty 和 idle_days_threshold 检测废弃物料，并排除仍被有效 BOM 版本引用且存在活跃生产订单的物料。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: detectObsoleteMaterial
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObsoleteMaterialDetectRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObsoleteMaterialDetectResponse'
  /api/listObsoleteMaterialDetection:
    get:
      summary: 查询废弃物料检测结果
      description: 分页查询废弃物料检测结果，支持按 material_id、status 和检测时间过滤。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listObsoleteMaterialDetection
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ObsoleteMaterialStatus'
        - name: detect_time_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: detect_time_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObsoleteMaterialPageResponse'
  /api/handleObsoleteMaterialDetection:
    post:
      summary: 处理废弃物料检测结果
      description: 将废弃物料检测结果更新为 handled 或 ignored，并记录 handler_id。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。状态流转：pending -> handled/ignored，handled 和 ignored 不可再次处理。
      operationId: handleObsoleteMaterialDetection
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObsoleteMaterialHandleRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObsoleteMaterialResponse'
  /api/addCompletionInbound:
    post:
      summary: 登记完工入库
      description: 登记完工入库单，将对应锁定记录置为 consumed，扣减原材料 locked_qty，增加成品 available_qty 并记录 batch_no。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。业务约束：qualified_qty 不得大于 finish_qty，finish_qty 必须大于 0，重复入库或订单状态非法返回 code 409。
      operationId: addCompletionInbound
      tags: [inventory]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionInboundCreateRequest'
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionInboundResponse'
  /api/listCompletionInbound:
    get:
      summary: 查询完工入库单
      description: 分页查询完工入库单，支持按 order_id、material_id 和入库时间过滤。权限：库存管理员、生产管理员、系统管理员可访问；无权限返回 code 403。
      operationId: listCompletionInbound
      tags: [inventory]
      security:
        - bearerAuth: []
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/PageSize'
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: material_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: inbound_time_start
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: inbound_time_end
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: HTTP 状态码固定返回 200，业务状态通过响应体 code 判断。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionInboundPageResponse'
components:
  schemas:
    InventoryAlertStatus:
      type: string
      description: 库存预警状态。pending 待处理，可处理或忽略；handled 已处理，流程结束；ignored 已忽略，流程结束。允许流转：pending -> handled/ignored。
      enum: [pending, handled, ignored]
    StockLockStatus:
      type: string
      description: 库存锁定状态。locked 已锁定，可释放或消耗；cancelled 已取消，释放完成；consumed 已消耗，完工入库后不可释放。允许流转：locked -> cancelled/consumed。
      enum: [locked, cancelled, consumed]
    ObsoleteMaterialStatus:
      type: string
      description: 废弃物料检测状态。pending 待处理，可处理或忽略；handled 已处理，流程结束；ignored 已忽略，流程结束。允许流转：pending -> handled/ignored。
      enum: [pending, handled, ignored]
    MaterialShortageCalculateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [material_id, production_qty, version_id]
            properties:
              material_id:
                type: integer
                format: int64
                example: 1001
              production_qty:
                type: number
                format: decimal
                minimum: 0
                exclusiveMinimum: true
                example: 100
              version_id:
                type: integer
                format: int64
                example: 1
    MaterialShortageItem:
      type: object
      required: [material_id, level, gross_requirement, available_qty, in_transit_qty, safety_stock, net_shortage_qty]
      properties:
        material_id:
          type: integer
          format: int64
          example: 1001
        material_name:
          type: string
          example: 钢板
        parent_material_id:
          type: integer
          format: int64
          nullable: true
        level:
          type: integer
          minimum: 0
          example: 2
        gross_requirement:
          type: number
          format: decimal
          description: 含损耗补偿后的总毛需求。
        available_qty:
          type: number
          format: decimal
        in_transit_qty:
          type: number
          format: decimal
        safety_stock:
          type: number
          format: decimal
        net_shortage_qty:
          type: number
          format: decimal
          minimum: 0
          description: max(毛需求 - 可用数量 - 在途数量 + 安全库存, 0)。
        suggested_purchase_qty:
          type: number
          format: decimal
          minimum: 0
    InventoryAlertEvent:
      type: object
      required: [alert_id, material_id, alert_type, available_qty, threshold, alert_time, status]
      properties:
        alert_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        material_name:
          type: string
        alert_type:
          type: string
          enum: [low_stock]
        available_qty:
          type: number
          format: decimal
        threshold:
          type: number
          format: decimal
        alert_time:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/InventoryAlertStatus'
        handler_id:
          type: integer
          format: int64
          nullable: true
        handle_time:
          type: string
          format: date-time
          nullable: true
    InventoryAlertGenerateRequest:
      type: object
      properties:
        material_id:
          type: integer
          format: int64
          nullable: true
    InventoryAlertHandleRequest:
      type: object
      required: [alert_id, status, handler_id]
      properties:
        alert_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [handled, ignored]
        handler_id:
          type: integer
          format: int64
    MaterialStockLockRequest:
      type: object
      required: [order_id, operator_id, items]
      properties:
        order_id:
          type: integer
          format: int64
        operator_id:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [material_id, lock_qty]
            properties:
              material_id:
                type: integer
                format: int64
              lock_qty:
                type: number
                format: decimal
                minimum: 0
                exclusiveMinimum: true
    MaterialStockReleaseRequest:
      type: object
      required: [lock_id, operator_id]
      properties:
        lock_id:
          type: integer
          format: int64
        operator_id:
          type: integer
          format: int64
    StockLockRecord:
      type: object
      required: [lock_id, order_id, material_id, lock_qty, status, lock_time, operator_id]
      properties:
        lock_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        material_name:
          type: string
        lock_qty:
          type: number
          format: decimal
        status:
          $ref: '#/components/schemas/StockLockStatus'
        lock_time:
          type: string
          format: date-time
        release_time:
          type: string
          format: date-time
          nullable: true
        operator_id:
          type: integer
          format: int64
    MaterialStockLockData:
      type: object
      required: [success, records, shortages]
      properties:
        success:
          type: boolean
        records:
          type: array
          items:
            $ref: '#/components/schemas/StockLockRecord'
        shortages:
          type: array
          items:
            type: object
            required: [material_id, required_qty, available_qty, shortage_qty]
            properties:
              material_id:
                type: integer
                format: int64
              required_qty:
                type: number
                format: decimal
              available_qty:
                type: number
                format: decimal
              shortage_qty:
                type: number
                format: decimal
    ObsoleteMaterialDetectRequest:
      type: object
      required: [idle_days_threshold]
      properties:
        idle_days_threshold:
          type: integer
          minimum: 1
        material_id:
          type: integer
          format: int64
          nullable: true
    ObsoleteMaterialDetection:
      type: object
      required: [detection_id, detect_time, material_id, available_qty, idle_days, status]
      properties:
        detection_id:
          type: integer
          format: int64
        detect_time:
          type: string
          format: date-time
        material_id:
          type: integer
          format: int64
        material_name:
          type: string
        available_qty:
          type: number
          format: decimal
        last_out_date:
          type: string
          format: date
          nullable: true
        idle_days:
          type: integer
        status:
          $ref: '#/components/schemas/ObsoleteMaterialStatus'
        handler_id:
          type: integer
          format: int64
          nullable: true
    ObsoleteMaterialHandleRequest:
      type: object
      required: [detection_id, status, handler_id]
      properties:
        detection_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [handled, ignored]
        handler_id:
          type: integer
          format: int64
    CompletionInboundCreateRequest:
      type: object
      required: [order_id, material_id, version_id, finish_qty, qualified_qty, batch_no, operator_id]
      properties:
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        version_id:
          type: integer
          format: int64
        finish_qty:
          type: number
          format: decimal
          minimum: 0
          exclusiveMinimum: true
        qualified_qty:
          type: number
          format: decimal
          minimum: 0
        batch_no:
          type: string
        operator_id:
          type: integer
          format: int64
    CompletionInboundOrder:
      type: object
      required: [inbound_id, order_id, material_id, version_id, finish_qty, qualified_qty, batch_no, inbound_time, operator_id]
      properties:
        inbound_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        material_id:
          type: integer
          format: int64
        product_name:
          type: string
        version_id:
          type: integer
          format: int64
        finish_qty:
          type: number
          format: decimal
        qualified_qty:
          type: number
          format: decimal
        batch_no:
          type: string
        inbound_time:
          type: string
          format: date-time
        operator_id:
          type: integer
          format: int64
        consumed_lock_records:
          type: array
          items:
            $ref: '#/components/schemas/StockLockRecord'
    MaterialShortageCalculateResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              required: [calculation_time, records]
              properties:
                calculation_time:
                  type: string
                  format: date-time
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/MaterialShortageItem'
    InventoryAlertGenerateResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true
              properties:
                generated_count:
                  type: integer
                skipped_pending_count:
                  type: integer
                records:
                  type: array
                  items:
                    $ref: '#/components/schemas/InventoryAlertEvent'
    InventoryAlertResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/InventoryAlertEvent'
              nullable: true
    InventoryAlertPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/InventoryAlertPageData'
              nullable: true
    InventoryAlertPageData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/InventoryAlertEvent'
    MaterialStockLockResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/MaterialStockLockData'
              nullable: true
    StockLockRecordResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/StockLockRecord'
              nullable: true
    StockLockRecordPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/StockLockRecordPageData'
              nullable: true
    StockLockRecordPageData:
      allOf:
        - $ref: './common.yaml#/components/schemas/PageResult'
        - type: object
          properties:
            records:
              type: array
              items:
                $ref: '#/components/schemas/StockLockRecord'
    ObsoleteMaterialDetectResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
