openapi: 3.0.1
info:
  title: 物料与 BOM 管理模块 API
  description: 物料与 BOM 管理模块接口定义。
  version: 0.1.0
tags:
  - name: material_bom
    description: 物料与 BOM 管理模块
paths:
  /api/listMaterialData:
    get:
      summary: 查询物料列表
      operationId: listMaterialData
      tags:
        - material_bom
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ApiResponse'
      security:
        - bearerAuth: []

  /api/addMaterialData:
    post:
      summary: 新增物料
      operationId: addMaterialData
      tags:
        - material_bom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Material'
      responses:
        '200':
          description: 新增成功
      security:
        - bearerAuth: []
  /api/updateMaterialData:
    post:
      summary: 修改物料
      operationId: updateMaterialData
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Material'
      responses:
        '200':
          description: 修改成功
      security:
        - bearerAuth: []

  /api/deleteMaterialData:
    post:
      summary: 删除物料
      operationId: deleteMaterialData
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                material_id:
                  type: integer
      responses:
        '200':
          description: 删除成功
      security:
        - bearerAuth: []

  /api/listMaterialCategoryData:
    get:
      summary: 查询物料分类
      operationId: listMaterialCategoryData
      tags:
        - material_bom
      responses:
        '200':
          description: 查询成功
      security:
        - bearerAuth: []

  /api/addMaterialCategoryData:
    post:
      summary: 新增物料分类
      operationId: addMaterialCategoryData
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCategory'
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/getBomData:
    get:
      summary: 查询 BOM
      operationId: getBomData
      tags:
        - material_bom
      responses:
        '200':
          description: 查询成功
      security:
        - bearerAuth: []

  /api/addBomData:
    post:
      summary: 新增 BOM
      operationId: addBomData
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Bom'
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/listBomVersionData:
    get:
      summary: 查询 BOM 版本
      operationId: listBomVersionData
      tags:
        - material_bom
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/addBomVersionData:
    post:
      summary: 新增 BOM 版本
      operationId: addBomVersionData
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BomVersion'
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/getMaterialInventoryData:
    get:
      summary: 查询物料库存
      operationId: getMaterialInventoryData
      tags:
        - material_bom
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/addRequirementAnalysis:
    post:
      summary: 新增需求分析
      operationId: addRequirementAnalysis
      tags:
        - material_bom
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemandAnalysis'
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

  /api/getRequirementAnalysis:
    get:
      summary: 查询需求分析结果
      operationId: getRequirementAnalysis
      tags:
        - material_bom
      responses:
        '200':
          description: 成功
      security:
        - bearerAuth: []

components:
  schemas:
    Material:
      type: object
      properties:
        material_id:
          type: integer
        material_name:
          type: string
        material_type:
          type: string
        model:
          type: string
        unit:
          type: string
        category_id:
          type: integer
        safety_stock:
          type: number
        default_supplier_id:
          type: integer
          nullable: true
        current_version_id:
          type: integer
          nullable: true
        created_by:
          type: integer
        created_time:
          type: string
          format: date-time
        updated_time:
          type: string
          format: date-time
    MaterialCategory:
      type: object
      properties:
        category_id:
          type: integer
        category_name:
          type: string
    Bom:
      type: object
      properties:
        bom_id:
          type: integer
        parent_material_id:
          type: integer
        child_material_id:
          type: integer
        version_id:
          type: integer
        quantity:
          type: number
        loss_rate:
          type: number
    BomVersion:
      type: object
      properties:
        version_id:
          type: integer
        material_id:
          type: integer
        version_no:
          type: string
        effective_date:
          type: string
          format: date
        expire_date:
          type: string
          format: date
          nullable: true
        change_reason:
          type: string
        created_by:
          type: integer
    MaterialStock:
      type: object
      properties:
        material_id:
          type: integer
        available_qty:
          type: number
        locked_qty:
          type: number
        last_in_date:
          type: string
          format: date-time
          nullable: true
        last_out_date:
          type: string
          format: date-time
          nullable: true
    DemandAnalysis:
      type: object
      properties:
        analysis_id:
          type: integer
        material_id:
          type: integer
        version_id:
          type: integer
        production_qty:
          type: number
        demand_detail:
          type: object
        analysis_time:
          type: string
          format: date-time
    RequirementAnalysis:
      deprecated: true
      allOf:
        - $ref: '#/components/schemas/DemandAnalysis'
