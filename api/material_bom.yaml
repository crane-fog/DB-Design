              allOf:
                - $ref: './common.yaml#/components/schemas/PageResult'
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: '#/components/schemas/BomVersion'
              nullable: true

    BomResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/Bom'
              nullable: true

    BomPageResponse:
      allOf:
        - $ref: './common.yaml#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              allOf:
                - $ref: './common.yaml#/components/schemas/PageResult'
                - type: object
                  properties:
                    records:
