openapi: 3.0.1
info:
  title: 数据库设计项目 API
  description: 项目 OpenAPI 总入口，按业务模块汇总接口定义。
  version: 0.1.0
servers:
  - url: http://localhost:5000
tags:
  - name: material_bom
    description: 物料与 BOM 管理模块
  - name: inventory
    description: 库存管理模块
  - name: purchase
    description: 采购管理模块
  - name: production
    description: 生产管理模块
  - name: quality_traceability
    description: 质量追溯模块
  - name: system
    description: 系统管理模块
paths:
  /api/login:
    $ref: './system.yaml#/paths/~1api~1login'
  /api/register:
    $ref: './system.yaml#/paths/~1api~1register'
  /api/getUserTest:
    $ref: './system.yaml#/paths/~1api~1getUserTest'
components:
  schemas:
    ApiResponse:
      $ref: './common.yaml#/components/schemas/ApiResponse'
    ErrorResponse:
      $ref: './common.yaml#/components/schemas/ErrorResponse'
    PageResult:
      $ref: './common.yaml#/components/schemas/PageResult'
    PageQuery:
      $ref: './common.yaml#/components/schemas/PageQuery'
  parameters:
    Page:
      $ref: './common.yaml#/components/parameters/Page'
    PageSize:
      $ref: './common.yaml#/components/parameters/PageSize'
  responses:
    Unauthorized:
      $ref: './common.yaml#/components/responses/Unauthorized'
    Forbidden:
      $ref: './common.yaml#/components/responses/Forbidden'
  securitySchemes:
    bearerAuth:
      $ref: './common.yaml#/components/securitySchemes/bearerAuth'
