    $ref: './inventory.yaml#/paths/~1api~1calculateMaterialShortage'
  /api/listInventoryAlert:
    $ref: './inventory.yaml#/paths/~1api~1listInventoryAlert'
  /api/generateInventoryAlert:
    $ref: './inventory.yaml#/paths/~1api~1generateInventoryAlert'
  /api/handleInventoryAlert:
    $ref: './inventory.yaml#/paths/~1api~1handleInventoryAlert'
  /api/lockMaterialStock:
    $ref: './inventory.yaml#/paths/~1api~1lockMaterialStock'
  /api/releaseMaterialStock:
    $ref: './inventory.yaml#/paths/~1api~1releaseMaterialStock'
  /api/listMaterialStockLock:
    $ref: './inventory.yaml#/paths/~1api~1listMaterialStockLock'
  /api/detectObsoleteMaterial:
    $ref: './inventory.yaml#/paths/~1api~1detectObsoleteMaterial'
