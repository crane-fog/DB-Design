openapi: 3.0.1
info:
  title: 测试
  description: 这是一个示例项目
  version: 0.1.0
tags: []
paths:
  /login:
    post:
      summary: 登录
      deprecated: false
      description: ''
      tags: []
      parameters: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                login:
                  $ref: '#/components/schemas/LoginData'
              required:
                - login
            examples: {}
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                  accessToken:
                    type: string
                  expires:
                    type: number
                required:
                  - msg
          headers: {}
      security: []
  /user-test:
    get:
      summary: 获取测试用户数据表
      deprecated: false
      description: ''
      operationId: getUserTest
      tags: []
      parameters: []
      responses:
        '200':
          description: 成功返回用户列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserData'
                example:
                  - id: 113
                    name: 李四
                    createdAt: '2026-03-02T21:44:02.29113'
                  - id: 114
                    name: 王七
                    createdAt: '2026-03-03T10:15:30.12345'
          headers: {}
      security: []
components:
  schemas:
    LoginData:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    LoginResponse:
      type: object
      properties:
        msg:
          type: string
        accessToken:
          type: string
        expires:
          type: number
      required:
        - msg
    UserData:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 113
        name:
          type: string
          example: 李四
        createdAt:
          type: string
          format: date-time
          example: '2026-03-02T21:44:02.29113'
  responses: {}
  securitySchemes: {}
servers: []
security: []
