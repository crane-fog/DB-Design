    $ref: './inventory.yaml#/paths/~1api~1listObsoleteMaterialDetection'
  /api/handleObsoleteMaterialDetection:
    $ref: './inventory.yaml#/paths/~1api~1handleObsoleteMaterialDetection'
  /api/addCompletionInbound:
    $ref: './inventory.yaml#/paths/~1api~1addCompletionInbound'
  /api/listCompletionInbound:
    $ref: './inventory.yaml#/paths/~1api~1listCompletionInbound'
